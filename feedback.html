<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>Kultura — Feedback</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <style>
    :root{
      --bg:#07080d; --surface:#14182b; --border:rgba(255,255,255,0.12);
      --brand:#f8589c; --text:#f8fafc; --text-dim:#94a3b8; --text-mute:#7d8aa0;
      --blue:#3b82f6; --purple:#8b5cf6; --green:#10b981; --red:#ef4444; --gold:#f5c542;
      --fill:rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
      -webkit-font-smoothing:antialiased; padding:32px 18px 64px; overflow-x:hidden;
    }
    body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0}
    body::before{width:460px;height:460px;background:var(--green);opacity:.18;top:-150px;left:-150px;animation:aura-a 30s ease-in-out infinite}
    body::after{width:400px;height:400px;background:var(--purple);opacity:.20;bottom:-150px;right:-150px;animation:aura-b 38s ease-in-out infinite}
    /* A third bloom, in the logo's magenta, and a slow drift on all three.
       `html` carries it because both of the body's pseudo-elements were already
       spoken for. Only `transform` animates: the blur is computed once and what
       moves is a texture the compositor slides, so this costs nothing on a phone
       opening the page off a QR code on mobile data. */
    html::before{content:"";position:fixed;width:400px;height:400px;border-radius:50%;
      filter:blur(150px);pointer-events:none;z-index:0;background:var(--brand);
      opacity:.18;top:38%;left:55%;animation:aura-c 46s ease-in-out infinite}
    @keyframes aura-a{
      0%{transform:translate3d(0,0,0) scale(1)}
      33%{transform:translate3d(16vw,11vh,0) scale(1.18)}
      66%{transform:translate3d(5vw,24vh,0) scale(.9)}
      100%{transform:translate3d(0,0,0) scale(1)}}
    @keyframes aura-b{
      0%{transform:translate3d(0,0,0) scale(1)}
      40%{transform:translate3d(-18vw,-13vh,0) scale(.86)}
      70%{transform:translate3d(-7vw,-26vh,0) scale(1.2)}
      100%{transform:translate3d(0,0,0) scale(1)}}
    @keyframes aura-c{
      0%{transform:translate3d(-50%,-50%,0) scale(1)}
      30%{transform:translate3d(-78%,-26%,0) scale(1.28)}
      65%{transform:translate3d(-20%,-74%,0) scale(.84)}
      100%{transform:translate3d(-50%,-50%,0) scale(1)}}
    /* Somebody who asked their phone to stop animating things asked for this
       too: the blooms stay where they are, the page keeps its depth. */
    @media (prefers-reduced-motion: reduce){
      body::before,body::after,html::before{animation:none}
      html::before{transform:translate3d(-50%,-50%,0)}}
    .wrap{max-width:520px;margin:0 auto;position:relative;z-index:1}
    .brand{display:flex;align-items:center;justify-content:center;margin-bottom:18px}
    .brand img{width:clamp(120px,34vw,170px);height:auto;filter:drop-shadow(0 5px 16px rgba(16,185,129,.28))}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px 22px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
    h1{font-size:22px;font-weight:900;text-align:center;letter-spacing:-.02em}
    .sub{text-align:center;color:var(--text-dim);font-size:14px;margin:4px 0 20px}
    /* Stars must read as a control, not decoration. Greyed-out at 40% opacity
       (the previous look) made the page's primary action look disabled. */
    .stars{display:flex;justify-content:center;gap:10px;margin:6px 0 18px}
    .star{
      font-size:40px;line-height:1;cursor:pointer;background:none;border:0;padding:2px;
      color:transparent;-webkit-text-stroke:2px var(--gold);
      transition:transform .12s ease,color .12s ease;
    }
    .star:hover,.star:focus-visible{transform:scale(1.12);outline:none}
    .star.on{color:var(--gold);-webkit-text-stroke:2px var(--gold);transform:scale(1.06)}
    .stars:hover .star{opacity:.55}
    .stars .star:hover,.stars:hover .star.on{opacity:1}
    .star-hint{text-align:center;font-size:12.5px;color:var(--text-mute);margin:-8px 0 14px;min-height:18px}
    label{display:block;font-size:13px;font-weight:600;color:var(--text-dim);margin:12px 0 6px}
    textarea,input{width:100%;background:var(--fill);border:1px solid var(--border);border-radius:12px;
      padding:12px 14px;color:var(--text);font-family:inherit;font-size:16px;outline:none}
    textarea:focus,input:focus{border-color:var(--blue)}
    .submit{width:100%;margin-top:20px;padding:15px;border:none;border-radius:14px;cursor:pointer;
      background:linear-gradient(90deg,var(--green),#06b6d4);color:#04120b;font-weight:800;font-size:16px;font-family:inherit}
    .submit:disabled{opacity:.6}
    .msg{text-align:center;font-size:14px;margin-top:12px;min-height:20px}
    .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
    .done{text-align:center;display:none}
    .done .ic{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:rgba(16,185,129,.16);display:grid;place-items:center;color:var(--green)}
    .done .ic svg{width:34px;height:34px}
    .hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
    .foot{text-align:center;color:var(--text-mute);font-size:12px;margin-top:22px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="logo.png" alt="Kultura"></div>
    <div class="card">
      <div id="form">
        <h1>Cum ți s-a părut?</h1>
        <div class="sub" id="evName">Lasă-ne părerea ta despre eveniment</div>
        <div class="stars" id="stars" role="radiogroup" aria-label="Notă">
          <button type="button" class="star" data-v="1" aria-label="1 stea">★</button><button type="button" class="star" data-v="2" aria-label="2 stele">★</button><button type="button" class="star" data-v="3" aria-label="3 stele">★</button><button type="button" class="star" data-v="4" aria-label="4 stele">★</button><button type="button" class="star" data-v="5" aria-label="5 stele">★</button>
        </div>
        <div class="star-hint" id="starHint">Atinge o stea</div>
        <div class="hp" aria-hidden="true"><label>Website</label><input type="text" id="hp" tabindex="-1" autocomplete="off"></div>
        <label>Comentariu (opțional)</label>
        <textarea id="comment" rows="4" placeholder="Ce ți-a plăcut? Ce am putea îmbunătăți?"></textarea>
        <label>Contact (opțional)</label>
        <input id="contact" type="text" placeholder="Telefon sau email, dacă vrei un răspuns">
        <button class="submit" id="submitBtn">Trimite feedback-ul</button>
        <div class="msg" id="msg"></div>
      </div>
      <div class="done" id="done">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h1>Mulțumim! 💚</h1>
        <p class="sub">Părerea ta ne ajută să facem evenimentele mai bune.</p>
      </div>
    </div>
    <p class="foot">© 2026 Kultura</p>
  </div>

  <script type="module">
    const URL = 'https://knphmxxokowwkruimdus.supabase.co';
    const ANON = 'sb_publishable_9b7WSJF4UlfF1JIdCDjWqQ_dxOTpqSW';
    const HEAD = { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON };

    let rating = 0, eventId = null;
    const starsEl = document.getElementById('stars');
    const msg = document.getElementById('msg');
    const showMsg = (t, k) => { msg.textContent = t; msg.className = 'msg ' + k; };
    const STAR_WORDS = ['', 'Slab', 'Așa și așa', 'Bine', 'Foarte bine', 'Excelent!'];
    const starHint = document.getElementById('starHint');
    starsEl.addEventListener('click', (e) => {
      const s = e.target.closest('.star'); if (!s) return;
      rating = parseInt(s.dataset.v, 10);
      [...starsEl.children].forEach(x => x.classList.toggle('on', parseInt(x.dataset.v, 10) <= rating));
      starHint.textContent = STAR_WORDS[rating] || '';
    });

    // Pull the current event name/id (reuses the public event-info function).
    (async () => {
      try {
        const evParam = new URLSearchParams(location.search).get('event') || '';
        const r = await fetch(URL + '/functions/v1/event-info'
          + (evParam ? '?event=' + encodeURIComponent(evParam) : ''),
          { headers: { apikey: ANON, Authorization: 'Bearer ' + ANON } });
        const d = await r.json();
        if (d.event) { eventId = d.event.id; if (d.event.title) document.getElementById('evName').textContent = d.event.title; }
      } catch (_) {}
    })();

    const readyAt = Date.now();
    const btn = document.getElementById('submitBtn');
    const finish = () => {
      document.getElementById('form').style.display = 'none';
      document.getElementById('done').style.display = 'block';
    };
    btn.addEventListener('click', async () => {
      if (Date.now() - readyAt < 2500) { finish(); return; } // too fast to be human
      if (!rating) { showMsg('Alege un număr de stele.', 'err'); return; }
      btn.disabled = true;
      // Submitting goes through the `submit` edge function, which enforces the
      // honeypot and a per-IP rate limit server-side. The client checks above
      // are only a courtesy — they are not what actually protects the table.
      let res, data;
      try {
        res = await fetch(URL + '/functions/v1/submit', {
          method: 'POST', headers: HEAD,
          body: JSON.stringify({
            kind: 'feedback',
            event_id: eventId,
            rating,
            comment: (document.getElementById('comment').value || '').trim() || null,
            contact: (document.getElementById('contact').value || '').trim() || null,
            company_website: document.getElementById('hp').value || '',
          }),
        });
        data = await res.json().catch(() => ({}));
      } catch (_) {
        btn.disabled = false; showMsg('Eroare de conexiune. Încearcă din nou.', 'err'); return;
      }
      btn.disabled = false;
      if (res.status === 429) { showMsg('Ai trimis deja feedback recent. Mulțumim!', 'err'); return; }
      if (!res.ok || data.error) { showMsg('Eroare: ' + (data.error || res.status), 'err'); return; }
      finish();
    });
  </script>
</body>
</html>
