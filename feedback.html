<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>Kultura — Feedback</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <style>
    :root{
      --bg:#07080d; --surface:#14182b; --border:rgba(255,255,255,0.12);
      --text:#f8fafc; --text-dim:#94a3b8; --text-mute:#64748b;
      --blue:#3b82f6; --purple:#8b5cf6; --green:#10b981; --red:#ef4444; --gold:#f5c542;
      --fill:rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
      -webkit-font-smoothing:antialiased; padding:32px 18px 64px; overflow-x:hidden;
    }
    body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0}
    body::before{width:460px;height:460px;background:var(--green);opacity:.18;top:-150px;left:-150px}
    body::after{width:400px;height:400px;background:var(--purple);opacity:.20;bottom:-150px;right:-150px}
    .wrap{max-width:520px;margin:0 auto;position:relative;z-index:1}
    .brand{display:flex;align-items:center;justify-content:center;margin-bottom:18px}
    .brand img{width:clamp(120px,34vw,170px);height:auto;filter:drop-shadow(0 5px 16px rgba(16,185,129,.28))}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px 22px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
    h1{font-size:22px;font-weight:900;text-align:center;letter-spacing:-.02em}
    .sub{text-align:center;color:var(--text-dim);font-size:14px;margin:4px 0 20px}
    .stars{display:flex;justify-content:center;gap:8px;margin:6px 0 18px}
    .star{font-size:40px;cursor:pointer;filter:grayscale(1);opacity:.4;transition:transform .1s ease,opacity .1s ease}
    .star.on{filter:none;opacity:1;transform:scale(1.06)}
    label{display:block;font-size:13px;font-weight:600;color:var(--text-dim);margin:12px 0 6px}
    textarea,input{width:100%;background:var(--fill);border:1px solid var(--border);border-radius:12px;
      padding:12px 14px;color:var(--text);font-family:inherit;font-size:15px;outline:none}
    textarea:focus,input:focus{border-color:var(--blue)}
    .submit{width:100%;margin-top:20px;padding:15px;border:none;border-radius:14px;cursor:pointer;
      background:linear-gradient(90deg,var(--green),#06b6d4);color:#04120b;font-weight:800;font-size:16px;font-family:inherit}
    .submit:disabled{opacity:.6}
    .msg{text-align:center;font-size:14px;margin-top:12px;min-height:20px}
    .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
    .done{text-align:center;display:none}
    .done .ic{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:rgba(16,185,129,.16);display:grid;place-items:center;color:var(--green)}
    .done .ic svg{width:34px;height:34px}
    .hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
    .foot{text-align:center;color:var(--text-mute);font-size:12px;margin-top:22px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="logo.png" alt="Kultura"></div>
    <div class="card">
      <div id="form">
        <h1>Cum ți s-a părut?</h1>
        <div class="sub" id="evName">Lasă-ne părerea ta despre eveniment</div>
        <div class="stars" id="stars">
          <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span>
          <span class="star" data-v="3">★</span><span class="star" data-v="4">★</span>
          <span class="star" data-v="5">★</span>
        </div>
        <div class="hp" aria-hidden="true"><label>Website</label><input type="text" id="hp" tabindex="-1" autocomplete="off"></div>
        <label>Comentariu (opțional)</label>
        <textarea id="comment" rows="4" placeholder="Ce ți-a plăcut? Ce am putea îmbunătăți?"></textarea>
        <label>Contact (opțional)</label>
        <input id="contact" type="text" placeholder="Telefon sau email, dacă vrei un răspuns">
        <button class="submit" id="submitBtn">Trimite feedback-ul</button>
        <div class="msg" id="msg"></div>
      </div>
      <div class="done" id="done">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h1>Mulțumim! 💚</h1>
        <p class="sub">Părerea ta ne ajută să facem evenimentele mai bune.</p>
      </div>
    </div>
    <p class="foot">© 2026 Kultura</p>
  </div>

  <script type="module">
    import { createClient } from './vendor/supabase-js.mjs';
    const URL = 'https://knphmxxokowwkruimdus.supabase.co';
    const ANON = 'sb_publishable_9b7WSJF4UlfF1JIdCDjWqQ_dxOTpqSW';
    const supa = createClient(URL, ANON);

    let rating = 0, eventId = null;
    const starsEl = document.getElementById('stars');
    const msg = document.getElementById('msg');
    const showMsg = (t, k) => { msg.textContent = t; msg.className = 'msg ' + k; };
    starsEl.addEventListener('click', (e) => {
      const s = e.target.closest('.star'); if (!s) return;
      rating = parseInt(s.dataset.v, 10);
      [...starsEl.children].forEach(x => x.classList.toggle('on', parseInt(x.dataset.v, 10) <= rating));
    });

    // Pull the current event name/id (reuses the public event-info function).
    (async () => {
      try {
        const r = await fetch(URL + '/functions/v1/event-info', { headers: { apikey: ANON, Authorization: 'Bearer ' + ANON } });
        const d = await r.json();
        if (d.event) { eventId = d.event.id; if (d.event.title) document.getElementById('evName').textContent = d.event.title; }
      } catch (_) {}
    })();

    const readyAt = Date.now();
    const btn = document.getElementById('submitBtn');
    btn.addEventListener('click', async () => {
      if (document.getElementById('hp').value) { document.getElementById('form').style.display = 'none'; document.getElementById('done').style.display = 'block'; return; }
      if (Date.now() - readyAt < 2500) { document.getElementById('form').style.display = 'none'; document.getElementById('done').style.display = 'block'; return; }
      if (!rating) { showMsg('Alege un număr de stele.', 'err'); return; }
      try {
        const last = parseInt(localStorage.getItem('kultura_fb_last') || '0', 10);
        if (last && Date.now() - last < 60000) { showMsg('Ai trimis deja feedback. Mulțumim!', 'err'); return; }
      } catch (_) {}
      btn.disabled = true;
      const row = {
        event_id: eventId,
        rating,
        comment: (document.getElementById('comment').value || '').trim() || null,
        contact: (document.getElementById('contact').value || '').trim() || null,
      };
      const { error } = await supa.from('event_feedback').insert(row);
      btn.disabled = false;
      if (error) { showMsg('Eroare: ' + error.message, 'err'); return; }
      try { localStorage.setItem('kultura_fb_last', String(Date.now())); } catch (_) {}
      document.getElementById('form').style.display = 'none';
      document.getElementById('done').style.display = 'block';
    });
  </script>
</body>
</html>
