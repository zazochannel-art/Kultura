<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>Kultura — Program eveniment</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <style>
    :root{
      --bg:#07080d; --surface:#14182b; --border:rgba(255,255,255,0.12);
      --brand:#f8589c; --text:#f8fafc; --text-dim:#94a3b8; --text-mute:#7d8aa0;
      --blue:#3b82f6; --cyan:#06b6d4; --purple:#8b5cf6; --green:#10b981;
      --fill:rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
      -webkit-font-smoothing:antialiased; padding:28px 16px 64px; overflow-x:hidden;
    }
    body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0}
    body::before{width:460px;height:460px;background:var(--blue);opacity:.22;top:-150px;left:-150px;animation:aura-a 30s ease-in-out infinite}
    body::after{width:400px;height:400px;background:var(--purple);opacity:.18;bottom:-150px;right:-150px;animation:aura-b 38s ease-in-out infinite}
    /* A third bloom, in the logo's magenta, and a slow drift on all three.
       `html` carries it because both of the body's pseudo-elements were already
       spoken for. Only `transform` animates: the blur is computed once and what
       moves is a texture the compositor slides, so this costs nothing on a phone
       opening the page off a QR code on mobile data. */
    html::before{content:"";position:fixed;width:400px;height:400px;border-radius:50%;
      filter:blur(150px);pointer-events:none;z-index:0;background:var(--brand);
      opacity:.18;top:38%;left:55%;animation:aura-c 46s ease-in-out infinite}
    @keyframes aura-a{
      0%{transform:translate3d(0,0,0) scale(1)}
      33%{transform:translate3d(16vw,11vh,0) scale(1.18)}
      66%{transform:translate3d(5vw,24vh,0) scale(.9)}
      100%{transform:translate3d(0,0,0) scale(1)}}
    @keyframes aura-b{
      0%{transform:translate3d(0,0,0) scale(1)}
      40%{transform:translate3d(-18vw,-13vh,0) scale(.86)}
      70%{transform:translate3d(-7vw,-26vh,0) scale(1.2)}
      100%{transform:translate3d(0,0,0) scale(1)}}
    @keyframes aura-c{
      0%{transform:translate3d(-50%,-50%,0) scale(1)}
      30%{transform:translate3d(-78%,-26%,0) scale(1.28)}
      65%{transform:translate3d(-20%,-74%,0) scale(.84)}
      100%{transform:translate3d(-50%,-50%,0) scale(1)}}
    /* Somebody who asked their phone to stop animating things asked for this
       too: the blooms stay where they are, the page keeps its depth. */
    @media (prefers-reduced-motion: reduce){
      body::before,body::after,html::before{animation:none}
      html::before{transform:translate3d(-50%,-50%,0)}}
    .wrap{max-width:560px;margin:0 auto;position:relative;z-index:1}
    .brand{display:flex;align-items:center;justify-content:center;margin-bottom:14px}
    .brand img{width:clamp(110px,30vw,150px);height:auto;filter:drop-shadow(0 5px 16px rgba(59,130,246,.28))}
    .cover{width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:18px;margin-bottom:14px;border:1px solid var(--border)}
    h1{font-size:clamp(20px,5vw,28px);font-weight:900;text-align:center;letter-spacing:-.02em}
    .meta{text-align:center;color:var(--text-dim);font-size:14px;margin:6px 0 22px}
    .meta b{color:var(--text)}
    .timeline{position:relative;padding-left:16px}
    .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
    .item{position:relative;padding:0 0 18px 18px}
    .item::before{content:"";position:absolute;left:-1px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.18)}
    .item.now::before{background:var(--green);box-shadow:0 0 0 4px rgba(16,185,129,.22)}
    .item.past::before{background:var(--text-mute);box-shadow:none}
    .time{font-size:13px;font-weight:800;color:var(--blue)}
    .item.now .time{color:var(--green)}
    .item.past{opacity:.55}
    .ttl{font-size:16px;font-weight:800;margin-top:1px}
    .notes{font-size:13px;color:var(--text-dim);margin-top:2px}
    .now-badge{font-size:10px;font-weight:800;color:#04120b;background:var(--green);border-radius:999px;padding:1px 7px;margin-left:6px;text-transform:uppercase}
    .msg{text-align:center;color:var(--text-dim);padding:60px 20px;font-size:15px}
    .foot{text-align:center;color:var(--text-mute);font-size:12px;margin-top:26px}
    /* Empty/error states are centred in the remaining space so they read as
       intentional rather than as a page that failed to finish loading. */
    .state{display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;gap:12px;min-height:52vh;padding:24px 12px}
    .state .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
      background:var(--fill);border:1px solid var(--border);font-size:26px}
    .state p{color:var(--text-dim);font-size:15px;margin:0;max-width:32ch}
    .retry{margin-top:2px;padding:11px 22px;border-radius:999px;cursor:pointer;font-family:inherit;
      font-size:14px;font-weight:800;color:#1a0410;border:0;background:var(--brand)}
    .retry:active{transform:scale(.97)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="logo.png" alt="Kultura"></div>
    <div id="content"><div class="state"><div class="ic">⏳</div><p>Se încarcă programul…</p></div></div>
    <p class="foot">© 2026 Kultura</p>
  </div>

  <script>
    // A link or QR printed for one specific event carries ?event=<id>; pass it
    // through so the poster keeps showing that event even after the pinned one
    // in Settings moves on.
    const EV_PARAM = new URLSearchParams(location.search).get('event') || '';
    const FN = 'https://knphmxxokowwkruimdus.supabase.co/functions/v1/event-info'
      + (EV_PARAM ? '?event=' + encodeURIComponent(EV_PARAM) : '');
    const ANON = 'sb_publishable_9b7WSJF4UlfF1JIdCDjWqQ_dxOTpqSW';
    const HEAD = { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON };
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const content = document.getElementById('content');
    const nowHHMM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

    // Centred state with an actual retry button (see vote.html for rationale).
    function showState(icon, text, retry) {
      content.innerHTML = `<div class="state">
          <div class="ic">${icon}</div>
          <p>${esc(text)}</p>
          ${retry ? '<button type="button" class="retry" id="retryBtn">Încearcă din nou</button>' : ''}
        </div>`;
      if (retry) document.getElementById('retryBtn').addEventListener('click', () => {
        showState('⏳', 'Se încarcă…', false); load();
      });
    }

    function render(d) {
      if (!d.event) { showState('📅', 'Programul nu este disponibil momentan.', false); return; }
      const ev = d.event, ag = d.agenda || [];
      const cover = ev.cover_url ? `<img class="cover" src="${esc(ev.cover_url)}" alt="">` : '';
      const meta = [ev.date, ev.location].filter(Boolean).map(esc).join(' · ');
      const now = nowHHMM();
      let curIdx = -1;
      ag.forEach((a, i) => { if ((a.at_time || '') <= now) curIdx = i; });
      const items = ag.length ? ag.map((a, i) => {
        const cls = i === curIdx ? 'now' : ((a.at_time || '') < now ? 'past' : '');
        return `<div class="item ${cls}">
            <div class="time">${esc(a.at_time || '—')}${i === curIdx ? '<span class="now-badge">acum</span>' : ''}</div>
            <div class="ttl">${esc(a.title || '')}</div>
            ${a.notes ? `<div class="notes">${esc(a.notes)}</div>` : ''}
          </div>`;
      }).join('') : `<div class="state"><div class="ic">📅</div><p>Programul va fi anunțat în curând.</p></div>`;
      content.innerHTML = `${cover}<h1>${esc(ev.title || 'Program')}</h1>
        ${meta ? `<div class="meta">${meta}</div>` : '<div style="height:12px"></div>'}
        ${ag.length ? `<div class="timeline">${items}</div>` : items}`;
    }
    async function load() {
      try {
        const r = await fetch(FN, { headers: HEAD });
        render(await r.json());
      } catch (_) { showState('📡', 'Nu am putut încărca programul. Verifică conexiunea.', true); }
    }
    load();
    setInterval(load, 60000); // refresh so the "now" marker advances
  </script>
</body>
</html>
