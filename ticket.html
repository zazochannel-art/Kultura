<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Biletul meu — KULTURA</title>
  <link rel="icon" href="logo.png">
  <style>
    :root{ --bg:#0b0d12; --card:#141821; --elev:#1b2130; --text:#eef2f8; --dim:#9aa6b8; --mute:#6b7686;
           --blue:#3b82f6; --green:#10b981; --border:rgba(255,255,255,.08); }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;
          background:radial-gradient(1200px 800px at 50% -10%, #182034, var(--bg)); color:var(--text);
          min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .ticket{ width:100%; max-width:400px; background:var(--card); border:1px solid var(--border);
             border-radius:24px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.5); }
    .t-head{ padding:22px 24px; background:linear-gradient(120deg,#3b82f6,#8b5cf6); text-align:center; }
    .t-head .brand{ font-weight:900; letter-spacing:.14em; font-size:13px; opacity:.9; }
    .t-head .ev{ font-size:18px; font-weight:800; margin-top:4px; }
    .t-body{ padding:24px; }
    .t-name{ font-size:24px; font-weight:800; text-align:center; }
    .t-sub{ text-align:center; color:var(--dim); font-size:14px; margin-top:4px; }
    .t-status{ display:inline-flex; align-items:center; gap:6px; margin:14px auto 0; padding:6px 14px;
               border-radius:999px; font-size:13px; font-weight:700; }
    .t-status.on{ background:rgba(16,185,129,.16); color:#34d399; }
    .t-status.off{ background:rgba(148,163,184,.14); color:var(--dim); }
    .t-status-wrap{ text-align:center; }
    .qr{ background:#fff; border-radius:18px; padding:16px; margin:22px auto 0; width:230px; height:230px;
         display:flex; align-items:center; justify-content:center; }
    .qr svg{ width:100%; height:100%; }
    .t-hint{ text-align:center; color:var(--mute); font-size:12px; margin-top:12px; }
    /* Telegram's own blue, so the button reads as "this opens Telegram". */
    .t-tg{
      display:block; margin-top:16px; padding:15px 14px; border-radius:14px;
      background:#229ED9; color:#fff; text-align:center; text-decoration:none;
      font-size:16px; font-weight:800; min-height:52px; line-height:22px;
    }
    .t-tg:active{ filter:brightness(.92); }
    .t-tg-ok{
      margin-top:16px; padding:13px 14px; border-radius:14px; text-align:center;
      font-size:14px; font-weight:700; color:#6ee7b7;
      background:rgba(16,185,129,.14); border:1px solid rgba(16,185,129,.36);
    }
    .t-rows{ margin-top:20px; border-top:1px solid var(--border); }
    .t-row{ display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .t-row .k{ color:var(--dim); }
    .t-row .v{ font-weight:700; text-align:right; }
    .state{ text-align:center; padding:60px 20px; color:var(--dim); }
    .spin{ width:32px; height:32px; border:3px solid rgba(255,255,255,.15); border-top-color:var(--blue);
           border-radius:50%; animation:s 1s linear infinite; margin:0 auto 14px; }
    @keyframes s{ to{ transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root" class="ticket"><div class="state"><div class="spin"></div>Se încarcă biletul…</div></div>

  <script src="vendor/qrcode.js"></script>
  <script>
    (function(){
      var SUPA = 'https://knphmxxokowwkruimdus.supabase.co';
      var KEY = 'sb_publishable_9b7WSJF4UlfF1JIdCDjWqQ_dxOTpqSW';
      var root = document.getElementById('root');
      var p = new URLSearchParams(location.search);
      var c = p.get('c') || '', k = p.get('k') || '';
      var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(ch){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); };

      function fail(msg){ root.innerHTML = '<div class="state">'+esc(msg)+'</div>'; }

      function row(k,v){ return v ? '<div class="t-row"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>' : ''; }

      // A Telegram bot can only write to someone who opened it first, so this
      // button is the only way a participant ever gets connected. The pass QR
      // already leads here, which is why it lives on this page.
      function tgBlock(d){
        if(!d.tg_link) return '';
        if(d.tg_linked) return '<div class="t-tg-ok">✓ Primești anunțurile pe Telegram</div>';
        return '<a class="t-tg" href="'+esc(d.tg_link)+'" target="_blank" rel="noopener">'+
                 'Primește anunțurile pe Telegram</a>'+
               '<div class="t-hint">Programul, zona și confirmarea participării, direct în Telegram.</div>';
      }

      function render(d){
        var carLine = [d.brand, d.model].filter(Boolean).join(' ');
        root.innerHTML =
          '<div class="t-head"><div class="brand">KULTURA</div>'+(d.event?'<div class="ev">'+esc(d.event)+'</div>':'')+'</div>'+
          '<div class="t-body">'+
            '<div class="t-name">'+esc(d.name||'—')+'</div>'+
            (carLine?'<div class="t-sub">'+esc(carLine)+'</div>':'')+
            '<div class="t-status-wrap"><span class="t-status '+(d.arrived?'on':'off')+'">'+(d.arrived?'🟢 A sosit':'🎫 Bilet valid')+'</span></div>'+
            '<div class="qr" id="qr"></div>'+
            '<div class="t-hint">Arată acest cod la intrare</div>'+
            '<div class="t-rows">'+row('Placă', d.plate)+row('Categorie', d.category)+row('Zonă', d.zone)+'</div>'+
            tgBlock(d)+
          '</div>';
        try {
          var qr = window.qrcode(0,'M'); qr.addData(d.qr || ('KULTURA:'+d.id+':'+(d.plate||''))); qr.make();
          document.getElementById('qr').innerHTML = qr.createSvgTag({ scalable:true, margin:0 });
        } catch(e){}
      }

      if(!c){ fail('Link invalid.'); return; }
      fetch(SUPA+'/functions/v1/ticket?c='+encodeURIComponent(c)+'&k='+encodeURIComponent(k), {
        headers:{ 'apikey':KEY }
      }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(res){
          if(!res.ok || res.j.error){ fail(res.j && res.j.error==='forbidden' ? 'Link invalid.' : 'Biletul nu a fost găsit.'); return; }
          render(res.j);
        })
        .catch(function(){ fail('Eroare de rețea. Încearcă din nou.'); });
    })();
  </script>
</body>
</html>
