<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>Kultura — Înscriere mașină</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <style>
    :root{
      --bg:#07080d; --surface:#14182b; --border:rgba(255,255,255,0.12);
      --text:#f8fafc; --text-dim:#94a3b8; --text-mute:#64748b;
      --blue:#3b82f6; --cyan:#06b6d4; --purple:#8b5cf6; --green:#10b981; --red:#ef4444;
      --fill:rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
      -webkit-font-smoothing:antialiased; padding:32px 18px 64px; overflow-x:hidden;
    }
    body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0}
    body::before{width:460px;height:460px;background:var(--purple);opacity:.26;top:-150px;left:-150px}
    body::after{width:400px;height:400px;background:var(--blue);opacity:.20;bottom:-150px;right:-150px}
    .wrap{max-width:520px;margin:0 auto;position:relative;z-index:1}
    .brand{display:flex;align-items:center;justify-content:center;margin-bottom:20px}
    .brand img{width:clamp(120px,34vw,170px);height:auto;filter:drop-shadow(0 5px 16px rgba(139,92,246,.28))}
    .card{
      background:var(--surface);border:1px solid var(--border);border-radius:24px;
      padding:28px 22px;backdrop-filter:blur(20px);box-shadow:0 24px 60px rgba(0,0,0,.4);
    }
    h1{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-bottom:6px;text-align:center}
    .sub{color:var(--text-dim);font-size:14px;text-align:center;margin-bottom:22px}
    label{display:block;font-size:13px;color:var(--text-dim);margin:14px 0 6px}
    .req{color:var(--cyan)}
    input,textarea{
      width:100%;padding:13px 14px;background:var(--fill);border:1px solid var(--border);
      border-radius:12px;color:var(--text);font-family:inherit;font-size:15px;outline:none;transition:border-color .15s;
    }
    input:focus,textarea:focus{border-color:var(--cyan)}
    input::placeholder,textarea::placeholder{color:var(--text-mute)}
    .row{display:flex;gap:12px}
    .row>div{flex:1;min-width:0}
    .phone-row{display:flex;gap:10px}
    .phone-row select{
      flex:0 0 auto;max-width:44%;width:auto;padding:13px 10px;background:var(--fill);border:1px solid var(--border);
      border-radius:12px;color:var(--text);font-family:inherit;font-size:15px;outline:none;
    }
    .phone-row select:focus{border-color:var(--cyan)}
    .phone-row input{flex:1;min-width:0}
    option{background:var(--surface);color:var(--text)}
    button.submit{
      width:100%;margin-top:22px;padding:15px;border:none;border-radius:14px;cursor:pointer;
      font-family:inherit;font-size:16px;font-weight:800;color:#fff;
      background:linear-gradient(135deg,var(--cyan),var(--purple));box-shadow:0 12px 30px rgba(6,182,212,.3);
    }
    button.submit:disabled{opacity:.6}
    .msg{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
    .msg.show{display:block}
    .msg.ok{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.3)}
    .msg.err{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.3)}
    .done{text-align:center;padding:20px 0}
    .done .ic{width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,.15);display:grid;place-items:center;margin:0 auto 16px}
    .done .ic svg{width:34px;height:34px;color:var(--green)}
    .done h2{font-size:20px;margin-bottom:8px}
    .done p{color:var(--text-dim);font-size:14px}
    .foot{text-align:center;color:var(--text-mute);font-size:12px;margin-top:20px}
    .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
    .photo-add{aspect-ratio:1;border:1.5px dashed var(--border);border-radius:12px;background:var(--fill);
      color:var(--text-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
      cursor:pointer;font-family:inherit;font-size:12px}
    .photo-add svg{width:22px;height:22px}
    .photo-thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
    .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .photo-thumb .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border:none;border-radius:50%;
      background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="logo.png" alt="Kultura"></div>
    <div class="card" id="card">
      <h1>Înscrie-ți mașina</h1>
      <p class="sub">Completează datele — organizatorii le verifică și te contactează.</p>
      <form id="regForm">
        <div class="row">
          <div><label>Marcă <span class="req">*</span></label><input name="brand" required placeholder="BMW"></div>
          <div><label>Model <span class="req">*</span></label><input name="model" required placeholder="M4"></div>
        </div>
        <div class="row">
          <div><label>Număr de înmatriculare</label><input name="plate" placeholder="B 100 XYZ"></div>
          <div><label>An fabricație</label><input name="year" inputmode="numeric" maxlength="4" placeholder="2018"></div>
        </div>
        <div class="row">
          <div><label>Nume proprietar <span class="req">*</span></label><input name="owner" required placeholder="Ion Popescu"></div>
          <div><label>Oraș</label><input name="city" placeholder="București"></div>
        </div>
        <label>Telefon (WhatsApp) <span class="req">*</span></label>
        <div class="phone-row">
          <select id="dial" aria-label="Cod țară"></select>
          <input name="phone" required type="tel" inputmode="tel" placeholder="6X XXX XXX">
        </div>
        <div class="row">
          <div><label>Telegram</label><input name="telegram" placeholder="@username"></div>
          <div><label>Email</label><input name="email" type="email" placeholder="exemplu@mail.ro"></div>
        </div>
        <label>Modificări / detalii tehnice</label>
        <textarea name="modifications" rows="3" placeholder="Ex: kit body, jante 19&quot;, evacuare sport, remapare..."></textarea>
        <label>Rețele sociale (Instagram etc.)</label>
        <input name="social_links" placeholder="instagram.com/... / @cont">
        <label>Transport</label>
        <input name="transport_info" placeholder="Pe roți / platformă / remorcă">
        <label>Observații</label>
        <textarea name="note" rows="2" placeholder="Cerințe speciale..."></textarea>
        <label>Poze cu mașina</label>
        <div id="photoGrid" class="photo-grid">
          <button type="button" id="photoAdd" class="photo-add" aria-label="Adaugă poze">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Adaugă</span>
          </button>
        </div>
        <input id="photoInput" type="file" accept="image/*" multiple style="display:none">
        <button type="submit" class="submit" id="submitBtn">Trimite înscrierea</button>
        <div class="msg" id="msg"></div>
      </form>
      <div class="done" id="done" style="display:none;">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h2>Înscriere trimisă!</h2>
        <p>Mulțumim! Organizatorii îți vor verifica înscrierea și te vor contacta.</p>
      </div>
    </div>
    <p class="foot">© 2026 Kultura</p>
  </div>

  <script type="module">
    import { createClient } from './vendor/supabase-js.mjs';
    const supa = createClient(
      'https://knphmxxokowwkruimdus.supabase.co',
      'sb_publishable_9b7WSJF4UlfF1JIdCDjWqQ_dxOTpqSW'
    );
    // Country dial codes (ISO2 + dial). Flags are derived from the ISO code so
    // we don't hand-type 200 emoji. Moldova is preselected (event is in MD).
    const COUNTRIES = [
      ['Moldova','MD','373'],['România','RO','40'],['Ucraina','UA','380'],['Rusia','RU','7'],
      ['Afganistan','AF','93'],['Albania','AL','355'],['Algeria','DZ','213'],['Andorra','AD','376'],
      ['Angola','AO','244'],['Argentina','AR','54'],['Armenia','AM','374'],['Australia','AU','61'],
      ['Austria','AT','43'],['Azerbaidjan','AZ','994'],['Bahrain','BH','973'],['Bangladesh','BD','880'],
      ['Belarus','BY','375'],['Belgia','BE','32'],['Bolivia','BO','591'],['Bosnia și Herțegovina','BA','387'],
      ['Brazilia','BR','55'],['Bulgaria','BG','359'],['Cambodgia','KH','855'],['Canada','CA','1'],
      ['Chile','CL','56'],['China','CN','86'],['Cipru','CY','357'],['Columbia','CO','57'],
      ['Coreea de Sud','KR','82'],['Costa Rica','CR','506'],['Croația','HR','385'],['Cuba','CU','53'],
      ['Danemarca','DK','45'],['Egipt','EG','20'],['Elveția','CH','41'],['Emiratele Arabe Unite','AE','971'],
      ['Ecuador','EC','593'],['Estonia','EE','372'],['Etiopia','ET','251'],['Filipine','PH','63'],
      ['Finlanda','FI','358'],['Franța','FR','33'],['Georgia','GE','995'],['Germania','DE','49'],
      ['Grecia','GR','30'],['Guatemala','GT','502'],['Hong Kong','HK','852'],['India','IN','91'],
      ['Indonezia','ID','62'],['Irak','IQ','964'],['Iran','IR','98'],['Irlanda','IE','353'],
      ['Islanda','IS','354'],['Israel','IL','972'],['Italia','IT','39'],['Japonia','JP','81'],
      ['Iordania','JO','962'],['Kazahstan','KZ','7'],['Kenya','KE','254'],['Kosovo','XK','383'],
      ['Kuweit','KW','965'],['Letonia','LV','371'],['Liban','LB','961'],['Libia','LY','218'],
      ['Liechtenstein','LI','423'],['Lituania','LT','370'],['Luxemburg','LU','352'],['Macedonia de Nord','MK','389'],
      ['Malaezia','MY','60'],['Malta','MT','356'],['Maroc','MA','212'],['Mexic','MX','52'],
      ['Monaco','MC','377'],['Muntenegru','ME','382'],['Norvegia','NO','47'],['Noua Zeelandă','NZ','64'],
      ['Nigeria','NG','234'],['Olanda','NL','31'],['Oman','OM','968'],['Pakistan','PK','92'],
      ['Panama','PA','507'],['Paraguay','PY','595'],['Peru','PE','51'],['Polonia','PL','48'],
      ['Portugalia','PT','351'],['Qatar','QA','974'],['Regatul Unit','GB','44'],['Republica Cehă','CZ','420'],
      ['Republica Dominicană','DO','1'],['Serbia','RS','381'],['Singapore','SG','65'],['Siria','SY','963'],
      ['Slovacia','SK','421'],['Slovenia','SI','386'],['Spania','ES','34'],['Statele Unite','US','1'],
      ['Suedia','SE','46'],['Africa de Sud','ZA','27'],['Tailanda','TH','66'],['Taiwan','TW','886'],
      ['Tanzania','TZ','255'],['Tunisia','TN','216'],['Turcia','TR','90'],['Turkmenistan','TM','993'],
      ['Uganda','UG','256'],['Ungaria','HU','36'],['Uruguay','UY','598'],['Uzbekistan','UZ','998'],
      ['Venezuela','VE','58'],['Vietnam','VN','84']
    ];
    const isoFlag = (iso) => iso.toUpperCase().replace(/./g, (c) => String.fromCodePoint(127397 + c.charCodeAt(0)));
    const dial = document.getElementById('dial');
    // Keep the first 4 (MD/RO/UA/RU) up top, sort the rest alphabetically.
    const top = COUNTRIES.slice(0, 4);
    const rest = COUNTRIES.slice(4).sort((a, b) => a[0].localeCompare(b[0], 'ro'));
    [...top, ...rest].forEach(([name, iso, code]) => {
      const o = document.createElement('option');
      o.value = '+' + code;
      o.textContent = `${isoFlag(iso)} ${name} +${code}`;
      dial.appendChild(o);
    });
    dial.value = '+373';

    // ----- Photos: pick, preview, downscale, upload -----
    const MAX_PHOTOS = 6;
    const photos = []; // { file, url (objectURL) }
    const grid = document.getElementById('photoGrid');
    const addBtn = document.getElementById('photoAdd');
    const fileInput = document.getElementById('photoInput');
    addBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      for (const f of Array.from(fileInput.files || [])) {
        if (photos.length >= MAX_PHOTOS) break;
        if (!/^image\//.test(f.type)) continue;
        photos.push({ file: f, url: URL.createObjectURL(f) });
      }
      fileInput.value = '';
      renderPhotos();
    });
    function renderPhotos() {
      grid.querySelectorAll('.photo-thumb').forEach((n) => n.remove());
      photos.forEach((p, i) => {
        const d = document.createElement('div');
        d.className = 'photo-thumb';
        d.innerHTML = '<img src="' + p.url + '" alt=""><button type="button" class="rm" aria-label="Șterge">&times;</button>';
        d.querySelector('.rm').addEventListener('click', () => { URL.revokeObjectURL(p.url); photos.splice(i, 1); renderPhotos(); });
        grid.insertBefore(d, addBtn);
      });
      addBtn.style.display = photos.length >= MAX_PHOTOS ? 'none' : '';
    }
    // Downscale to <=1600px, JPEG ~0.8, to keep uploads small.
    function compress(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const max = 1600;
          let { width: w, height: h } = img;
          if (w > max || h > max) { const s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          cv.toBlob((b) => resolve(b || file), 'image/jpeg', 0.8);
        };
        img.onerror = () => resolve(file);
        img.src = URL.createObjectURL(file);
      });
    }
    async function uploadPhotos() {
      const urls = [];
      for (const p of photos) {
        const blob = await compress(p.file);
        const path = 'reg/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
        const { error } = await supa.storage.from('registration-photos').upload(path, blob, { contentType: 'image/jpeg' });
        if (error) throw error;
        urls.push(supa.storage.from('registration-photos').getPublicUrl(path).data.publicUrl);
      }
      return urls;
    }

    const form = document.getElementById('regForm');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    const showMsg = (txt, kind) => { msg.textContent = txt; msg.className = 'msg show ' + kind; };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const g = (k) => (fd.get(k) || '').toString().trim();
      const localPhone = g('phone');
      const fullPhone = localPhone ? (dial.value + ' ' + localPhone).trim() : null;
      const base = {
        brand: g('brand') || null, model: g('model') || null, plate: g('plate') || null,
        owner: g('owner') || null, city: g('city') || null, phone: fullPhone,
        telegram: g('telegram') || null, email: g('email') || null,
        year: (parseInt((g('year') || '').replace(/\D/g, ''), 10) || null),
        social_links: g('social_links') || null, transport_info: g('transport_info') || null,
        modifications: g('modifications') || null, note: g('note') || null,
        status: 'pending'
      };
      if (!base.brand || !base.model || !base.owner || !base.phone) {
        showMsg('Completează marca, modelul, numele și telefonul.', 'err'); return;
      }
      btn.disabled = true;
      let uploaded = [];
      try {
        if (photos.length) { showMsg('Se încarcă pozele…', 'ok'); uploaded = await uploadPhotos(); }
      } catch (err) { btn.disabled = false; showMsg('Nu s-au putut încărca pozele: ' + (err.message || err), 'err'); return; }
      const { error } = await supa.from('car_registrations').insert({ ...base, photos: uploaded });
      btn.disabled = false;
      if (error) { showMsg('Eroare: ' + error.message, 'err'); return; }
      document.getElementById('done').style.display = 'block';
      form.style.display = 'none';
    });
  </script>
</body>
</html>
