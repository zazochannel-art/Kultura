<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · MontajPro</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .box { max-width: 22rem; text-align: center; }
      .badge {
        width: 64px; height: 64px; margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #06b6d4, #8b5cf6);
        display: flex; align-items: center; justify-content: center;
        font-size: 30px;
      }
      h1 { font-size: 1.35rem; margin: 0 0 8px; }
      p { color: #a1a1aa; line-height: 1.55; margin: 0 0 20px; font-size: 0.95rem; }
      button {
        width: 100%; height: 48px; border: 0; border-radius: 14px;
        background: #06b6d4; color: #04222a; font-size: 1rem; font-weight: 600;
      }
      a.home {
        display: block; margin-top: 12px; height: 48px; line-height: 48px;
        border-radius: 14px; border: 1px solid #27272a; color: #fafafa;
        text-decoration: none; font-size: 0.95rem; font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="badge">🔨</div>
      <h1>Ești offline</h1>
      <p>
        Nu-i nimic — datele salvate rămân pe telefon și se trimit automat când
        revine semnalul. Încearcă să reîncarci pagina.
      </p>
      <button type="button" onclick="location.reload()">Reîncarcă</button>
      <a class="home" href="/">Deschide aplicația</a>
    </div>
  </body>
</html>
