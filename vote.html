<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>Kultura — Votează mașina preferată</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <style>
    :root{
      --bg:#07080d; --surface:#14182b; --border:rgba(255,255,255,0.12);
      --brand:#f8589c; --text:#f8fafc; --text-dim:#94a3b8; --text-mute:#7d8aa0;
      --blue:#3b82f6; --cyan:#06b6d4; --purple:#8b5cf6; --green:#10b981; --gold:#f5c542;
      --fill:rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
      -webkit-font-smoothing:antialiased; padding:28px 16px 64px; overflow-x:hidden;
    }
    /* The moving background: three blooms that cross most of the screen instead
       of drifting a tenth of it, so the movement is actually visible. Each is a
       radial-gradient fading to nothing at 68% of its radius rather than a hard
       disc under a 130px blur — same soft edge, none of the filter work, which
       matters on a phone opening this off a QR code on mobile data. The alpha-0
       stop is spelled out in rgba: `transparent` fades through transparent
       *black* on older WebViews and greys the bloom out at its edge. */
    body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;will-change:transform}
    body::before{width:56vmax;height:56vmax;top:-22vmax;left:-22vmax;
      background:radial-gradient(circle at 50% 50%,var(--purple) 0%,rgba(139,92,246,0) 68%);
      opacity:.46;animation:aura-a 20s ease-in-out infinite}
    body::after{width:50vmax;height:50vmax;bottom:-20vmax;right:-20vmax;
      background:radial-gradient(circle at 50% 50%,var(--blue) 0%,rgba(59,130,246,0) 68%);
      opacity:.38;animation:aura-b 26s ease-in-out infinite}
    /* A third bloom, in the logo's magenta. `html` carries it because both of
       the body's pseudo-elements were already spoken for. */
    html::before{content:"";position:fixed;width:42vmax;height:42vmax;border-radius:50%;
      pointer-events:none;z-index:0;
      background:radial-gradient(circle at 50% 50%,var(--brand) 0%,rgba(248,88,156,0) 68%);
      opacity:.26;top:50%;left:50%;will-change:transform;animation:aura-c 32s ease-in-out infinite}
    /* Three journeys, at three lengths that do not divide into each other, so
       the picture never visibly repeats. Only `transform` moves. */
    @keyframes aura-a{
      0%{transform:translate3d(0,0,0) scale(1)}
      30%{transform:translate3d(70vw,18vh,0) scale(1.15)}
      60%{transform:translate3d(28vw,62vh,0) scale(.85)}
      100%{transform:translate3d(0,0,0) scale(1)}}
    @keyframes aura-b{
      0%{transform:translate3d(0,0,0) scale(1)}
      35%{transform:translate3d(-64vw,-22vh,0) scale(.85)}
      70%{transform:translate3d(-22vw,-64vh,0) scale(1.2)}
      100%{transform:translate3d(0,0,0) scale(1)}}
    @keyframes aura-c{
      0%{transform:translate3d(-50%,-50%,0) scale(1)}
      28%{transform:translate3d(-115%,-105%,0) scale(1.2)}
      55%{transform:translate3d(10%,-90%,0) scale(.8)}
      80%{transform:translate3d(-25%,20%,0) scale(1.1)}
      100%{transform:translate3d(-50%,-50%,0) scale(1)}}
    /* Somebody who asked their phone to stop animating things asked for this
       too: the blooms stay where they are, the page keeps its depth. */
    @media (prefers-reduced-motion: reduce){
      body::before,body::after,html::before{animation:none}
      html::before{transform:translate3d(-50%,-50%,0)}}
    .wrap{max-width:640px;margin:0 auto;position:relative;z-index:1}
    .brand{display:flex;align-items:center;justify-content:center;margin-bottom:14px}
    .brand img{width:clamp(110px,30vw,150px);height:auto;filter:drop-shadow(0 5px 16px rgba(139,92,246,.28))}
    h1{font-size:clamp(20px,5vw,26px);font-weight:900;text-align:center;letter-spacing:-.02em}
    .sub{text-align:center;color:var(--text-dim);font-size:14px;margin:4px 0 18px}
    .total{text-align:center;color:var(--text-mute);font-size:12px;margin-bottom:14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .vsearch{margin:0 0 14px}
    .vsearch input{width:100%;padding:14px 16px;border-radius:14px;font-size:16px;font-family:inherit;
      background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#e8edf5;outline:none}
    .vsearch input:focus{border-color:#f8589c}
    .vsearch input::placeholder{color:#7d8aa0}
    .vempty{text-align:center;color:#7d8aa0;font-size:14px;padding:28px 12px}
    .eno{position:absolute;top:8px;left:8px;z-index:2;font-size:13px;font-weight:900;letter-spacing:.02em;
      padding:3px 9px;border-radius:999px;background:#f8589c;color:#1a0410}
    .vcard{
      background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;
      cursor:pointer;transition:transform .12s ease,border-color .15s ease;position:relative;
    }
    .vcard:active{transform:scale(.97)}
    .vcard.mine{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,197,66,.35)}
    .vcard .ph{aspect-ratio:4/3;background:#0b0e18 center/cover no-repeat;display:block}
    .vcard .noph{aspect-ratio:4/3;display:grid;place-items:center;color:var(--text-mute);font-size:34px;background:var(--fill)}
    .vcard .body{padding:10px 12px}
    .vcard .nm{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .vcard .pl{font-size:12px;color:var(--text-dim);font-family:monospace}
    .vcard .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
    .vcard .votes{font-size:13px;font-weight:900;color:var(--gold)}
    .vcard .pick{font-size:11px;font-weight:800;color:#07080d;background:var(--gold);border-radius:999px;padding:2px 8px}
    .rank{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;backdrop-filter:blur(4px)}
    .msg{text-align:center;color:var(--text-dim);padding:60px 20px;font-size:15px}
    .foot{text-align:center;color:var(--text-mute);font-size:12px;margin-top:26px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;
      background:var(--green);color:#04120b;font-weight:800;font-size:14px;padding:10px 18px;border-radius:999px;
      transition:all .25s ease;z-index:10;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    /* Empty/error states are centred in the remaining space so they read as
       intentional rather than as a page that failed to finish loading. */
    .state{display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;gap:12px;min-height:52vh;padding:24px 12px}
    .state .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
      background:var(--fill);border:1px solid var(--border);font-size:26px}
    .state p{color:var(--text-dim);font-size:15px;margin:0;max-width:32ch}
    .retry{margin-top:2px;padding:11px 22px;border-radius:999px;cursor:pointer;font-family:inherit;
      font-size:14px;font-weight:800;color:#1a0410;border:0;background:var(--brand)}
    .retry:active{transform:scale(.97)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="logo.png" alt="Kultura"></div>
    <h1>🏆 Votează mașina preferată</h1>
    <div class="sub" id="evName"></div>
    <div class="total" id="total"></div>
    <div id="content"><div class="state"><div class="ic">⏳</div><p>Se încarcă…</p></div></div>
    <p class="foot">© 2026 Kultura · Un vot per dispozitiv</p>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const FN = 'https://knphmxxokowwkruimdus.supabase.co/functions/v1/vote';
    const ANON = 'sb_publishable_9b7WSJF4UlfF1JIdCDjWqQ_dxOTpqSW';
    const HEAD = { 'Content-Type': 'application/json', 'apikey': ANON, 'Authorization': 'Bearer ' + ANON };
    // Stable per-device voter token.
    let voter = '';
    try {
      voter = localStorage.getItem('kultura_voter') || '';
      if (!voter) { voter = 'v_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('kultura_voter', voter); }
    } catch (_) { voter = 'v_' + Math.random().toString(36).slice(2); }

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const content = document.getElementById('content');
    const toastEl = document.getElementById('toast');
    let _t = null;
    function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(_t); _t = setTimeout(() => toastEl.classList.remove('show'), 1800); }

    // Centred state with an actual retry button — at an event on patchy signal
    // a bare error message leaves people with nothing to press.
    function showState(icon, text, retry) {
      content.innerHTML = `<div class="state">
          <div class="ic">${icon}</div>
          <p>${esc(text)}</p>
          ${retry ? '<button type="button" class="retry" id="retryBtn">Încearcă din nou</button>' : ''}
        </div>`;
      if (retry) document.getElementById('retryBtn').addEventListener('click', () => {
        showState('⏳', 'Se încarcă…', false); load();
      });
    }

    let allCars = [];
    let lastData = null;

    function render(data) {
      lastData = data;
      allCars = data.cars || [];
      document.getElementById('evName').textContent = data.event || '';
      document.getElementById('total').textContent = data.total ? (data.total + ' voturi') : '';
      if (!data.cars || !data.cars.length) { showState('🚗', 'Încă nu sunt mașini de votat.', false); return; }
      paint();
    }

    // Voting by the number on the windscreen is how a car show actually works —
    // typing "47" beats scrolling a grid of 200 tiles looking for a plate.
    function paint() {
      const q = (document.getElementById('vSearch')?.value || '').trim().toLowerCase();
      const asNo = /^#?\d+$/.test(q) ? q.replace('#', '') : null;
      const data = lastData;
      const cars = allCars.filter(c => {
        if (!q) return true;
        if (asNo) return String(c.entry_no || '') === asNo;
        return (c.name || '').toLowerCase().includes(q)
            || (c.plate || '').toLowerCase().includes(q)
            || (c.owner || '').toLowerCase().includes(q);
      });
      const search = `<div class="vsearch">
          <input id="vSearch" inputmode="search" placeholder="Caută după numărul de pe parbriz…" value="${esc(q)}">
        </div>`;
      if (!cars.length) {
        content.innerHTML = search + `<div class="vempty">Nicio mașină cu „${esc(q)}".</div>`;
        wireSearch();
        return;
      }
      content.innerHTML = search + `<div class="grid">${cars.map((c, i) => {
        const mine = data.my_choice === c.id;
        const rank = i < 3 && c.votes > 0 ? `<span class="rank">#${i + 1}</span>` : '';
        const ph = c.photo ? `<span class="ph" style="background-image:url('${esc(c.photo)}')"></span>` : `<span class="noph">🚗</span>`;
        const no = c.entry_no ? `<span class="eno">#${esc(String(c.entry_no))}</span>` : '';
        return `<div class="vcard${mine ? ' mine' : ''}" data-id="${c.id}">
            ${ph}${rank}${no}
            <div class="body">
              <div class="nm">${esc(c.name || '—')}</div>
              <div class="pl">${esc(c.plate || '')}${c.klass ? ' · ' + esc(c.klass) : ''}</div>
              <div class="row">
                <span class="votes">${c.votes} ⭐</span>
                ${mine ? `<span class="pick">Votul tău</span>` : ''}
              </div>
            </div>
          </div>`;
      }).join('')}</div>`;
      wireSearch();
    }

    // Re-created with the markup on every paint, so re-attach and keep focus.
    function wireSearch() {
      const el = document.getElementById('vSearch');
      if (!el) return;
      el.addEventListener('input', () => {
        const pos = el.selectionStart;
        paint();
        const again = document.getElementById('vSearch');
        if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (_) {} }
      });
    }

    async function load() {
      try {
        const r = await fetch(FN + '?voter=' + encodeURIComponent(voter), { headers: HEAD });
        const data = await r.json();
        if (!data.open) { showState('🏁', 'Votarea nu este deschisă momentan. Revino în timpul evenimentului.', false); document.getElementById('total').textContent=''; return; }
        render(data);
      } catch (_) { showState('📡', 'Nu am putut încărca votarea. Verifică conexiunea.', true); }
    }

    async function vote(carId) {
      try {
        const r = await fetch(FN, { method: 'POST', headers: HEAD, body: JSON.stringify({ car_id: carId, voter }) });
        const data = await r.json();
        if (data.open === false) { toast('Votarea s-a închis'); return; }
        if (data.error) { toast('Eroare'); return; }
        render(data); toast('Votul tău a fost înregistrat! ⭐');
      } catch (_) { toast('Eroare de conexiune'); }
    }

    content.addEventListener('click', (e) => {
      const card = e.target.closest('[data-id]');
      if (card) vote(parseInt(card.dataset.id, 10));
    });
    load();
    setInterval(load, 7000); // live results
  </script>
</body>
</html>
