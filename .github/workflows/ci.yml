name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Syntax, i18n, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Parse every first-party JS file. Vendored bundles are skipped: they are
      # third-party builds we don't edit, and some ship non-standard syntax.
      - name: Syntax check
        run: |
          set -e
          files=$(git ls-files '*.js' '*.mjs' | grep -v '^vendor/' | grep -v '^moneyflow/')
          echo "$files"
          for f in $files; do node --check "$f"; done

      # Locale packs must stay in lockstep (same keys, same {placeholders}).
      - name: i18n guard
        run: node scripts/check-i18n.mjs

      # An orphan closing tag renders fine and logs nothing — the smoke suite
      # cannot see it. This can.
      - name: Markup guard
        run: node scripts/check-markup.mjs

      - name: Unit tests
        run: node --test tests/unit.mjs

      # The service worker cache must be bumped whenever shipped assets change,
      # otherwise returning users keep the stale app shell.
      - name: Service worker version bumped
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD -- '*.js' '*.mjs' '*.css' '*.html' | grep -v '^tests/' | grep -v '^scripts/' | grep -v '^moneyflow/' || true)
          if [ -z "$changed" ]; then
            echo "No shipped assets changed — nothing to bump."; exit 0
          fi
          old=$(git show "$base":sw.js | sed -n "s/^const CACHE = '\(.*\)';/\1/p")
          new=$(sed -n "s/^const CACHE = '\(.*\)';/\1/p" sw.js)
          echo "cache: $old -> $new"
          if [ "$old" = "$new" ]; then
            echo "::error::Assets changed but sw.js CACHE is still '$new'. Bump it so clients get the update."
            exit 1
          fi

  # What the hermetic smoke suite structurally cannot check: grants, RLS, and
  # what the edge functions really answer. Read-only plus refusals — see the
  # header of tests/contract.mjs for the safety rules.
  contract:
    name: Contract (real backend)
    runs-on: ubuntu-latest
    # A backend outage is not a reason to block a pull request, but the result
    # is still reported. CONTRACT_REQUIRE turns "could not reach Supabase" into
    # a failure rather than a silent skip.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run contract tests
        env:
          CONTRACT_REQUIRE: '1'
        run: node tests/contract.mjs

  smoke:
    name: Smoke (Playwright)
    runs-on: ubuntu-latest
    # Browser-driven and slower than the checks above; it must not block a PR
    # on a flaky browser download, but its result is still reported.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright axe-core >/dev/null
          npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: node tests/smoke.mjs

  # MONEYFLOW is a separate Next.js app under moneyflow/ with its own toolchain,
  # so it gets its own job rather than being squeezed into the checks above.
  moneyflow:
    name: MONEYFLOW (types, lint, unit, schema, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moneyflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: moneyflow/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Triggers, RLS policies and the RPCs cannot be unit-tested in TypeScript.
      # This applies every migration to a real PostgreSQL and asserts they work.
      - name: Schema checks
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/verify-schema.sh

      # The build has to pass without secrets: nothing may read a Supabase key
      # at module load, or a preview deploy breaks before it starts.
      - name: Build
        run: npm run build

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
